<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Quiz me if you can</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h2>Quiz me if you can</h2>
    <form id="quizForm1">
        <fieldset id="quizForm1fieldset1">
            <legend>1. It's Friday night. What are you doing?</legend>
            <input type="radio" id="q1a1" name="question1" value="carrot">
                <label for="q1a1">Crunching on something loudly for no reason</label><br>
            <input type="radio" id="q1a2" name="question1" value="potato">
                <label for="q1a2">Lying on the couch, doing absolutely nothing</label><br>
            <input type="radio" id="q1a3" name="question1" value="chili">
                <label for="q1a3">Starting drama with someone</label><br>
            <input type="radio" id="q1a4" name="question1" value="cucumber">
                <label for="q1a4">Being suspiciously chill about everything</label>
        </fieldset>

        <fieldset id="quizForm1fieldset2">
            <legend>2. Pick a superpower</legend>
            <input type="radio" id="q2a1" name="question2" value="carrot">
                <label for="q2a1">X-ray vision (mostly for snacks)</label><br>
            <input type="radio" id="q2a2" name="question2" value="potato">
                <label for="q2a2">Invisibility (so you can nap in peace)</label><br>
            <input type="radio" id="q2a3" name="question2" value="chili">
                <label for="q2a3">Fire breathing</label><br>
            <input type="radio" id="q2a4" name="question2" value="cucumber">
                <label for="q2a4">Mind control, used only for mild chaos</label>
        </fieldset>

        <fieldset id="quizForm1fieldset3">
            <legend>3. Your friends describe you as...</legend>
            <input type="radio" id="q3a1" name="question3" value="carrot">
                <label for="q3a1">Loud but lovable</label><br>
            <input type="radio" id="q3a2" name="question3" value="potato">
                <label for="q3a2">Reliable, a little lazy</label><br>
            <input type="radio" id="q3a3" name="question3" value="chili">
                <label for="q3a3">Intense, no in-between</label><br>
            <input type="radio" id="q3a4" name="question3" value="cucumber">
                <label for="q3a4">Mysteriously calm at all times</label>
        </fieldset>

        <fieldset id="quizForm1fieldset4">
            <legend>4. Choose a vacation spot</legend>
            <input type="radio" id="q4a1" name="question4" value="carrot">
                <label for="q4a1">Amusement park, all day, no breaks</label><br>
            <input type="radio" id="q4a2" name="question4" value="potato">
                <label for="q4a2">A hammock. Any hammock.</label><br>
            <input type="radio" id="q4a3" name="question4" value="chili">
                <label for="q4a3">Somewhere with spicy street food</label><br>
            <input type="radio" id="q4a4" name="question4" value="cucumber">
                <label for="q4a4">A quiet spa, alone</label>
        </fieldset>

    <input type="submit" value="Find out my vegetable!">
    
    </form>
    <div id ="quizForm1results" class="quizForm1results">
        <p>Your vegetable will appear here...</p>
    </div>
    <button type="button" id="playAgain">Play again</button>
</body>
</html>
